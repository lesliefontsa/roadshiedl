<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadShield Sentinelle - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            min-height: 500px;
        }
        
        .login-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .login-right {
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #fff;
        }
        
        .brand-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .brand-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
        
        .feature-list {
            list-style: none;
            padding: 0;
        }
        
        .feature-list li {
            padding: 0.5rem 0;
            opacity: 0.9;
        }
        
        .feature-list i {
            margin-right: 0.5rem;
            color: #ffd700;
        }
        
        .form-floating {
            margin-bottom: 1rem;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .user-type-selector {
            margin-bottom: 2rem;
        }
        
        .user-type-btn {
            border: 2px solid #667eea;
            color: #667eea;
            background: transparent;
            padding: 10px 20px;
            border-radius: 25px;
            margin: 0 5px;
            transition: all 0.3s ease;
        }
        
        .user-type-btn.active,
        .user-type-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .login-container {
                margin: 1rem;
            }
            
            .login-left {
                padding: 2rem;
            }
            
            .login-right {
                padding: 2rem;
            }
            
            .brand-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row login-container">
            <!-- Left Panel -->
            <div class="col-md-6 login-left">
                <div>
                    <div class="logo">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h1 class="brand-title">RoadShield</h1>
                    <p class="brand-subtitle">Sentinelle du Transport</p>
                    
                    <ul class="feature-list">
                        <li><i class="fas fa-check-circle"></i> Gestion complète des voyages</li>
                        <li><i class="fas fa-check-circle"></i> Réservations en temps réel</li>
                        <li><i class="fas fa-check-circle"></i> Suivi des paiements</li>
                        <li><i class="fas fa-check-circle"></i> Interface administrateur</li>
                        <li><i class="fas fa-check-circle"></i> Sécurité renforcée</li>
                    </ul>
                </div>
            </div>
            
            <!-- Right Panel -->
            <div class="col-md-6 login-right">
                <div>
                    <h2 class="text-center mb-4">Connexion</h2>
                    
                    <!-- User Type Selection -->
                    <div class="user-type-selector text-center">
                        <button type="button" class="btn user-type-btn active" onclick="selectUserType('client')">
                            <i class="fas fa-user me-2"></i>Client
                        </button>
                        <button type="button" class="btn user-type-btn" onclick="selectUserType('admin')">
                            <i class="fas fa-user-cog me-2"></i>Administrateur
                        </button>
                    </div>
                    
                    <!-- Login Form -->
                    <form id="loginForm">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" placeholder="Email" required>
                            <label for="email"><i class="fas fa-envelope me-2"></i>Adresse email</label>
                        </div>
                        
                        <div class="form-floating">
                            <input type="password" class="form-control" id="password" placeholder="Mot de passe" required>
                            <label for="password"><i class="fas fa-lock me-2"></i>Mot de passe</label>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Se souvenir de moi
                                </label>
                            </div>
                            <a href="#" class="forgot-password">Mot de passe oublié ?</a>
                        </div>
                        
                        <button type="submit" class="btn btn-login btn-primary w-100 mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                        </button>
                    </form>
                    
                    <div class="text-center">
                        <p class="mb-0">Pas encore de compte ? 
                            <a href="#" class="text-primary" onclick="showRegisterForm()">S'inscrire</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUserType = 'client';
        
        function selectUserType(type) {
            currentUserType = type;
            
            // Update button states
            document.querySelectorAll('.user-type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        user_type: currentUserType
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // Store token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user_type', currentUserType);
                    
                    // Redirect based on user type
                    if (currentUserType === 'admin') {
                        window.location.href = '/admin-backoffice/';
                    } else {
                        window.location.href = '/client/';
                    }
                } else {
                    alert('Erreur de connexion: ' + data.message);
                }
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur de connexion. Veuillez réessayer.');
            }
        });
        
        function showRegisterForm() {
            // Redirect to registration page
            window.location.href = '/register/';
        }
    </script>
</body>
</html>
