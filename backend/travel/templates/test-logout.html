<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Déconnexion Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-bug"></i> Test de Déconnexion Admin</h3>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <strong>Instructions :</strong> Ce test simule le processus de déconnexion admin.
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Test 1: Déconnexion Simple</h5>
                                <button class="btn btn-primary" onclick="testSimpleLogout()">
                                    <i class="fas fa-sign-out-alt"></i> Test Déconnexion Simple
                                </button>
                                <div id="simpleResult" class="mt-3"></div>
                            </div>
                            
                            <div class="col-md-6">
                                <h5>Test 2: Déconnexion avec Nettoyage</h5>
                                <button class="btn btn-warning" onclick="testFullLogout()">
                                    <i class="fas fa-broom"></i> Test Déconnexion Complète
                                </button>
                                <div id="fullResult" class="mt-3"></div>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <div class="row">
                            <div class="col-12">
                                <h5>Test 3: Accès Direct à la Déconnexion</h5>
                                <a href="/auth/logout/" class="btn btn-danger">
                                    <i class="fas fa-door-open"></i> Déconnexion Directe
                                </a>
                                
                                <div class="mt-3">
                                    <strong>État du localStorage :</strong>
                                    <div id="storageState" class="alert alert-secondary"></div>
                                </div>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <div class="row">
                            <div class="col-12">
                                <h5>Actions Rapides</h5>
                                <button class="btn btn-success btn-sm me-2" onclick="setTestData()">
                                    <i class="fas fa-database"></i> Définir Données Test
                                </button>
                                <button class="btn btn-secondary btn-sm me-2" onclick="clearTestData()">
                                    <i class="fas fa-trash"></i> Effacer Données
                                </button>
                                <button class="btn btn-info btn-sm" onclick="showStorageState()">
                                    <i class="fas fa-eye"></i> Afficher État
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const alertClass = type === 'success' ? 'alert-success' : 
                              type === 'error' ? 'alert-danger' : 
                              type === 'warning' ? 'alert-warning' : 'alert-info';
            
            element.innerHTML = `<div class="alert ${alertClass} mb-1">[${timestamp}] ${message}</div>`;
        }

        function testSimpleLogout() {
            log('simpleResult', 'Test de déconnexion simple...', 'info');
            
            // Simuler les données d'admin
            localStorage.setItem('authToken', 'test_admin_token');
            localStorage.setItem('userInfo', JSON.stringify({
                username: 'admin',
                role: 'admin',
                is_staff: true
            }));
            
            log('simpleResult', 'Données admin créées. Redirection vers logout...', 'warning');
            
            setTimeout(() => {
                window.location.href = '/auth/logout/';
            }, 2000);
        }

        function testFullLogout() {
            log('fullResult', 'Test de déconnexion complète...', 'info');
            
            // Nettoyer d'abord
            localStorage.removeItem('authToken');
            localStorage.removeItem('userInfo');
            
            log('fullResult', 'localStorage nettoyé. Redirection...', 'success');
            
            setTimeout(() => {
                window.location.href = '/auth/logout/';
            }, 1500);
        }

        function setTestData() {
            localStorage.setItem('authToken', 'test_token_admin_123');
            localStorage.setItem('userInfo', JSON.stringify({
                id: 1,
                username: 'admin',
                email: 'admin@roadshield.com',
                role: 'admin',
                is_staff: true
            }));
            showStorageState();
        }

        function clearTestData() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userInfo');
            showStorageState();
        }

        function showStorageState() {
            const token = localStorage.getItem('authToken');
            const user = localStorage.getItem('userInfo');
            
            let html = '<strong>AuthToken:</strong> ' + (token ? '✅ Présent' : '❌ Absent') + '<br>';
            html += '<strong>UserInfo:</strong> ' + (user ? '✅ Présent' : '❌ Absent');
            
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    html += `<br><small>Utilisateur: ${userData.username} (${userData.role})</small>`;
                } catch (e) {
                    html += '<br><small class="text-danger">Données corrompues</small>';
                }
            }
            
            document.getElementById('storageState').innerHTML = html;
        }

        // Afficher l'état initial au chargement
        window.onload = showStorageState;
    </script>
</body>
</html>
