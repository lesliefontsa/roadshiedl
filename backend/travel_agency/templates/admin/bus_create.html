{% extends 'admin/base.html' %}

{% block title %}{{ page_title }} - RoadShield{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-bus text-primary"></i> {{ page_title }}</h2>
    <a href="{% url 'admin_buses_list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Retour à la liste
    </a>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <form method="post">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="bus_number" class="form-label">Numéro du Bus *</label>
                    <input type="text" class="form-control" id="bus_number" name="bus_number" required 
                           placeholder="Ex: BUS-001">
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="bus_model" class="form-label">Modèle *</label>
                    <input type="text" class="form-control" id="bus_model" name="bus_model" required 
                           placeholder="Ex: Mercedes Sprinter">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="total_seats" class="form-label">Nombre de Places *</label>
                    <input type="number" class="form-control" id="total_seats" name="total_seats" required 
                           min="1" max="100" placeholder="Ex: 50">
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="year" class="form-label">Année</label>
                    <input type="number" class="form-control" id="year" name="year" 
                           min="1990" max="2030" placeholder="Ex: 2023">
                </div>
            </div>

            <div class="mb-3">
                <label for="status" class="form-label">Statut</label>
                <select class="form-select" id="status" name="status">
                    <option value="disponible" selected>Disponible</option>
                    <option value="en_route">En Route</option>
                    <option value="maintenance">En Maintenance</option>
                    <option value="hors_service">Hors Service</option>
                    <option value="en_panne">En Panne</option>
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'admin_buses_list' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Annuler
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Créer le Bus
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
