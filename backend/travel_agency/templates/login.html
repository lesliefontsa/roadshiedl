<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - RoadShield Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
        }
        .test-accounts {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="login-card">
                    <div class="login-header">
                        <h2><i class="fas fa-shield-alt"></i> RoadShield Travel</h2>
                        <p class="mb-0">Connexion Sécurisée</p>
                    </div>
                    
                    <div class="p-4">
                        <div id="alertContainer"></div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user"></i> Nom d'utilisateur
                                </label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock"></i> Mot de passe
                                </label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-login text-white w-100 py-2">
                                <i class="fas fa-sign-in-alt"></i> Se Connecter
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="/register/" class="text-decoration-none">
                                <i class="fas fa-user-plus"></i> Pas de compte ? S'inscrire maintenant
                            </a>
                        </div>
                        
                        <!-- Comptes de test -->
                        <div class="test-accounts">
                            <h6><i class="fas fa-info-circle"></i> Comptes de Test :</h6>
                            <div class="row">
                                <div class="col-md-6">
                                    <strong>👨‍💼 Admins :</strong>
                                    <ul class="list-unstyled small">
                                        <li><code>admin</code> / <code>admin123</code></li>
                                        <li><code>manager</code> / <code>manager123</code></li>
                                    </ul>
                                </div>
                                <div class="col-md-6">
                                    <strong>👥 Clients :</strong>
                                    <ul class="list-unstyled small">
                                        <li><code>client1</code> / <code>client123</code></li>
                                        <li><code>marie</code> / <code>marie123</code></li>
                                        <li><code>paul</code> / <code>paul123</code></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Formulaire d'inscription (caché par défaut) -->
        <div class="row justify-content-center mt-4" id="registerSection" style="display: none;">
            <div class="col-md-8 col-lg-6">
                <div class="login-card">
                    <div class="login-header">
                        <h2><i class="fas fa-user-plus"></i> Créer un Compte</h2>
                        <p class="mb-0">Inscription Client</p>
                    </div>
                    
                    <div class="p-4">
                        <form id="registerForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Prénom</label>
                                    <input type="text" class="form-control" name="first_name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nom</label>
                                    <input type="text" class="form-control" name="last_name" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Nom d'utilisateur</label>
                                <input type="text" class="form-control" name="username" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Téléphone (Orange Money)</label>
                                <input type="tel" class="form-control" name="phone" placeholder="+237 6XX XXX XXX" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" name="password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-login text-white w-100 py-2">
                                <i class="fas fa-user-plus"></i> Créer le Compte
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="#" onclick="showLoginForm()" class="text-decoration-none">
                                Déjà un compte ? Se connecter
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class AuthManager {
            constructor() {
                this.apiBaseUrl = 'http://localhost:8009';
                this.init();
            }

            init() {
                // Vérifier si déjà connecté
                const token = localStorage.getItem('authToken');
                if (token) {
                    this.redirectToDashboard(token);
                }

                // Event listeners
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.login();
                });

                document.getElementById('registerForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.register();
                });
            }

            async login() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch(`${this.apiBaseUrl}/auth/login/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (data.status === 'success') {
                        // Stocker le token et les infos utilisateur
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('userInfo', JSON.stringify(data.user));

                        this.showAlert('Connexion réussie ! Redirection...', 'success');

                        // Redirection selon le rôle
                        setTimeout(() => {
                            if (data.user.is_staff) {
                                window.location.href = '/admin-dashboard/';
                            } else {
                                window.location.href = '/client-dashboard/';
                            }
                        }, 1500);

                    } else {
                        this.showAlert(data.message || 'Erreur de connexion', 'danger');
                    }

                } catch (error) {
                    console.error('Erreur login:', error);
                    this.showAlert('Erreur de connexion au serveur', 'danger');
                }
            }

            async register() {
                const form = document.getElementById('registerForm');
                const formData = new FormData(form);
                const data = Object.fromEntries(formData);

                try {
                    const response = await fetch(`${this.apiBaseUrl}/auth/register/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (result.status === 'success') {
                        // Stocker le token et les infos utilisateur
                        localStorage.setItem('authToken', result.token);
                        localStorage.setItem('userInfo', JSON.stringify(result.user));

                        this.showAlert('Compte créé avec succès ! Redirection...', 'success');

                        setTimeout(() => {
                            window.location.href = '/client-dashboard/';
                        }, 1500);

                    } else {
                        this.showAlert(result.message || 'Erreur lors de la création du compte', 'danger');
                    }

                } catch (error) {
                    console.error('Erreur register:', error);
                    this.showAlert('Erreur de connexion au serveur', 'danger');
                }
            }

            redirectToDashboard(token) {
                // Récupérer les infos utilisateur du localStorage
                const userInfo = localStorage.getItem('userInfo');
                if (userInfo) {
                    const user = JSON.parse(userInfo);
                    if (user.is_staff) {
                        window.location.href = '/admin-dashboard/';
                    } else {
                        window.location.href = '/client-dashboard/';
                    }
                } else {
                    // Fallback: tenter de déterminer depuis le token
                    if (token.includes('admin')) {
                        window.location.href = '/admin-dashboard/';
                    } else {
                        window.location.href = '/client-dashboard/';
                    }
                }
            }

            showAlert(message, type) {
                const alertHtml = `
                    <div class="alert alert-${type} alert-dismissible fade show">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
                document.getElementById('alertContainer').innerHTML = alertHtml;
            }
        }

        function showRegisterForm() {
            document.getElementById('registerSection').style.display = 'block';
            document.querySelector('.login-card').style.display = 'none';
        }

        function showLoginForm() {
            document.getElementById('registerSection').style.display = 'none';
            document.querySelector('.login-card').style.display = 'block';
        }

        // Fonctions de test rapide
        function quickLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        // Initialiser
        document.addEventListener('DOMContentLoaded', () => {
            new AuthManager();
        });
    </script>
</body>
</html>
