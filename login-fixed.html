<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - RoadShield Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
        }
        .test-accounts {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="login-card">
                    <div class="login-header">
                        <h2><i class="fas fa-shield-alt"></i> RoadShield Travel</h2>
                        <p class="mb-0">Connexion Sécurisée</p>
                    </div>
                    
                    <div class="p-4">
                        <div id="alertContainer"></div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user"></i> Nom d'utilisateur
                                </label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock"></i> Mot de passe
                                </label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-login text-white w-100 py-2">
                                <i class="fas fa-sign-in-alt"></i> Se Connecter
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="/register/" class="text-decoration-none">
                                <i class="fas fa-user-plus"></i> Pas de compte ? S'inscrire maintenant
                            </a>
                        </div>
                        
                        <!-- Comptes de test -->
                        <div class="test-accounts">
                            <h6><i class="fas fa-info-circle"></i> Comptes de Test :</h6>
                            <div class="row">
                                <div class="col-md-6">
                                    <strong>👨‍💼 Admins :</strong>
                                    <ul class="list-unstyled small">
                                        <li><button class="btn btn-link btn-sm p-0" onclick="quickLogin('admin','admin123')">admin / admin123</button></li>
                                        <li><button class="btn btn-link btn-sm p-0" onclick="quickLogin('manager','manager123')">manager / manager123</button></li>
                                    </ul>
                                </div>
                                <div class="col-md-6">
                                    <strong>👥 Clients :</strong>
                                    <ul class="list-unstyled small">
                                        <li><button class="btn btn-link btn-sm p-0" onclick="quickLogin('client1','client123')">client1 / client123</button></li>
                                        <li><button class="btn btn-link btn-sm p-0" onclick="quickLogin('marie','marie123')">marie / marie123</button></li>
                                        <li><button class="btn btn-link btn-sm p-0" onclick="quickLogin('paul','paul123')">paul / paul123</button></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class AuthManager {
            constructor() {
                this.apiBaseUrl = 'http://localhost:8009';
                this.init();
            }

            init() {
                // Vérifier si déjà connecté SANS redirection automatique
                const token = localStorage.getItem('authToken');
                const user = JSON.parse(localStorage.getItem('userInfo') || 'null');
                
                if (token && user) {
                    this.showAlert(`
                        <strong>Déjà connecté :</strong> ${user.first_name} ${user.last_name} (${user.role})
                        <div class="mt-2">
                            <button class="btn btn-primary btn-sm me-2" onclick="goToDashboard()">
                                <i class="fas fa-tachometer-alt"></i> Aller au Dashboard
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="logout()">
                                <i class="fas fa-sign-out-alt"></i> Se déconnecter
                            </button>
                        </div>
                    `, 'info');
                }

                // Event listeners
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.login();
                });
            }

            async login() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Afficher un indicateur de chargement
                const submitBtn = document.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
                submitBtn.disabled = true;

                try {
                    const response = await fetch(`${this.apiBaseUrl}/auth/login/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (data.status === 'success') {
                        // Stocker le token et les infos utilisateur
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('userInfo', JSON.stringify(data.user));

                        this.showAlert(`
                            <strong>Connexion réussie !</strong><br>
                            Bienvenue ${data.user.first_name} ${data.user.last_name}<br>
                            <small>Redirection dans 3 secondes...</small>
                        `, 'success');

                        // Redirection selon le rôle avec délai plus long
                        setTimeout(() => {
                            if (data.user.role === 'admin') {
                                window.location.href = '/admin-backoffice/';
                            } else {
                                window.location.href = '/client/';
                            }
                        }, 3000); // 3 secondes au lieu de 1.5

                    } else {
                        this.showAlert(data.message || 'Erreur de connexion', 'danger');
                    }

                } catch (error) {
                    console.error('Erreur login:', error);
                    this.showAlert('Erreur de connexion au serveur', 'danger');
                } finally {
                    // Restaurer le bouton
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            }

            redirectToDashboard(token) {
                // Tenter de déterminer le rôle depuis le token
                if (token.includes('admin')) {
                    window.location.href = '/admin-backoffice/';
                } else {
                    window.location.href = '/client/';
                }
            }

            showAlert(message, type) {
                const alertHtml = `
                    <div class="alert alert-${type} alert-dismissible fade show">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
                document.getElementById('alertContainer').innerHTML = alertHtml;
            }
        }

        // Fonctions de test rapide
        function quickLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        // Fonction pour aller au dashboard selon le rôle
        function goToDashboard() {
            const user = JSON.parse(localStorage.getItem('userInfo') || 'null');
            if (user && user.role === 'admin') {
                window.location.href = '/admin-backoffice/';
            } else {
                window.location.href = '/client/';
            }
        }

        // Fonction de déconnexion
        function logout() {
            if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('userInfo');
                location.reload();
            }
        }

        // Initialiser
        document.addEventListener('DOMContentLoaded', () => {
            new AuthManager();
        });
    </script>
</body>
</html>
