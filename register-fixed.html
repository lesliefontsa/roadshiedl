<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Compte - RoadShield Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .register-header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .btn-register {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            border-radius: 10px;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="register-card">
                    <div class="register-header">
                        <h2><i class="fas fa-user-plus"></i> Créer un Compte</h2>
                        <p class="mb-0">Rejoignez RoadShield Travel</p>
                    </div>
                    
                    <div class="p-4">
                        <div id="alertContainer"></div>

                        <form id="registerForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Prénom *</label>
                                    <input type="text" class="form-control" name="first_name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nom *</label>
                                    <input type="text" class="form-control" name="last_name" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Téléphone (Orange Money) *</label>
                                <input type="tel" class="form-control" name="phone" placeholder="+237 69X XXX XXX" required>
                                <div class="form-text">Format: +237 69X XXX XXX ou +237 65X XXX XXX</div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Nom d'utilisateur *</label>
                                <input type="text" class="form-control" name="username" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Mot de passe *</label>
                                <input type="password" class="form-control" name="password" required minlength="6">
                                <div class="form-text">Minimum 6 caractères</div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Confirmer le mot de passe *</label>
                                <input type="password" class="form-control" name="password_confirm" required>
                            </div>
                            
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="acceptTerms" required>
                                    <label class="form-check-label" for="acceptTerms">
                                        J'accepte les conditions d'utilisation
                                    </label>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-register text-white w-100 py-2">
                                <i class="fas fa-user-plus"></i> Créer le Compte
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="/login/" class="text-decoration-none">
                                Déjà un compte ? Se connecter
                            </a>
                        </div>
                        
                        <div class="mt-4 p-3 bg-light rounded">
                            <h6><i class="fas fa-gift"></i> Bonus de Bienvenue :</h6>
                            <p class="mb-0 small">1000 XAF offerts pour votre premier voyage !</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class RegisterManager {
            constructor() {
                this.apiBaseUrl = 'http://localhost:8009';
                this.init();
            }

            init() {
                document.getElementById('registerForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.register();
                });

                // Validation en temps réel
                document.addEventListener('input', (e) => {
                    if (e.target.name === 'password_confirm') {
                        this.validatePasswordMatch();
                    }
                    if (e.target.name === 'phone') {
                        this.validateOrangeNumber(e.target.value);
                    }
                });
            }

            validatePasswordMatch() {
                const password = document.querySelector('input[name="password"]').value;
                const passwordConfirm = document.querySelector('input[name="password_confirm"]');
                
                if (passwordConfirm.value && password !== passwordConfirm.value) {
                    passwordConfirm.classList.add('is-invalid');
                    passwordConfirm.setCustomValidity('Les mots de passe ne correspondent pas');
                } else {
                    passwordConfirm.classList.remove('is-invalid');
                    passwordConfirm.setCustomValidity('');
                    if (passwordConfirm.value) {
                        passwordConfirm.classList.add('is-valid');
                    }
                }
            }

            validateOrangeNumber(phoneNumber) {
                const phoneInput = document.querySelector('input[name="phone"]');
                const orangePatterns = [
                    /^\+237\s?69\d{7}$/,
                    /^\+237\s?65\d{7}$/
                ];
                
                const isValid = orangePatterns.some(pattern => pattern.test(phoneNumber));
                
                if (phoneNumber && !isValid) {
                    phoneInput.classList.add('is-invalid');
                    phoneInput.setCustomValidity('Numéro Orange Money invalide');
                } else {
                    phoneInput.classList.remove('is-invalid');
                    phoneInput.setCustomValidity('');
                    if (phoneNumber) {
                        phoneInput.classList.add('is-valid');
                    }
                }
            }

            async register() {
                const form = document.getElementById('registerForm');
                const formData = new FormData(form);
                const data = Object.fromEntries(formData);

                // Vérifications
                if (!document.getElementById('acceptTerms').checked) {
                    this.showAlert('Veuillez accepter les conditions d\'utilisation', 'warning');
                    return;
                }

                if (data.password !== data.password_confirm) {
                    this.showAlert('Les mots de passe ne correspondent pas', 'danger');
                    return;
                }

                try {
                    const response = await fetch(`${this.apiBaseUrl}/auth/register/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (result.status === 'success') {
                        localStorage.setItem('authToken', result.token);
                        localStorage.setItem('userInfo', JSON.stringify(result.user));

                        this.showAlert('Compte créé avec succès ! Bienvenue chez RoadShield !', 'success');

                        setTimeout(() => {
                            window.location.href = '/client/';
                        }, 2000);

                    } else {
                        this.showAlert(result.message || 'Erreur lors de la création du compte', 'danger');
                    }

                } catch (error) {
                    console.error('Erreur création compte:', error);
                    this.showAlert('Erreur de connexion au serveur', 'danger');
                }
            }

            showAlert(message, type) {
                const alertHtml = `
                    <div class="alert alert-${type} alert-dismissible fade show">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
                document.getElementById('alertContainer').innerHTML = alertHtml;
            }
        }

        // Initialiser
        document.addEventListener('DOMContentLoaded', () => {
            new RegisterManager();
        });
    </script>
</body>
</html>
